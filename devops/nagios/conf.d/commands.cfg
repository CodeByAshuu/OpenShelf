# ==============================================================================
# Nagios Check & Notification Commands: commands.cfg
# ==============================================================================

# ── Service & Application Checks ──────────────────────────────────────────────
define command {
    command_name    check_http_port
    command_line    /usr/lib/nagios/plugins/check_http -H localhost -p $ARG1$
}

define command {
    command_name    check_http_health
    command_line    /usr/lib/nagios/plugins/check_http -H localhost -p $ARG1$ -u $ARG2$ -s $ARG3$
}

define command {
    command_name    check_tcp_port
    command_line    /usr/lib/nagios/plugins/check_tcp -H localhost -p $ARG1$
}

define command {
    command_name    check_docker_container
    command_line    /usr/lib/nagios/plugins/check_docker.sh $ARG1$
}

define command {
    command_name    check_systemd_service
    command_line    /usr/lib/nagios/plugins/check_service.sh $ARG1$
}

# ── System Resource Utilization Checks ───────────────────────────────────────
define command {
    command_name    check_system_memory
    command_line    /usr/lib/nagios/plugins/check_mem.sh -w $ARG1$ -c $ARG2$
}

define command {
    command_name    check_local_load
    command_line    /usr/lib/nagios/plugins/check_load -w $ARG1$ -c $ARG2$
}

define command {
    command_name    check_local_disk
    command_line    /usr/lib/nagios/plugins/check_disk -w $ARG1$ -c $ARG2$ -p $ARG3$
}

# ── Notification Handlers ─────────────────────────────────────────────────────
define command {
    command_name    notify-host-by-email
    command_line    /usr/bin/printf "%b" "***** Nagios Alert *****\n\nNotification Type: $NOTIFICATIONTYPE$\nHost: $HOSTNAME$\nState: $HOSTSTATE$\nAddress: $HOSTADDRESS$\nInfo: $HOSTOUTPUT$\n\nDate/Time: $LONGDATETIME$\n" | /usr/bin/logger -t nagios-host-alert
}

define command {
    command_name    notify-service-by-email
    command_line    /usr/bin/printf "%b" "***** Nagios Alert *****\n\nNotification Type: $NOTIFICATIONTYPE$\nService: $SERVICEDESC$\nHost: $HOSTALIAS$\nAddress: $HOSTADDRESS$\nState: $SERVICESTATE$\nDate/Time: $LONGDATETIME$\n\nAdditional Info:\n$SERVICEOUTPUT$\n" | /usr/bin/logger -t nagios-service-alert
}
