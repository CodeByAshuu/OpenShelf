# ==============================================================================
# OpenShelf Host Definition: openshelf_server.cfg
# ==============================================================================

define host {
    use                     linux-server
    host_name               openshelf-server
    alias                   OpenShelf EC2 Host (Ubuntu 24.04 LTS)
    address                 127.0.0.1
    max_check_attempts      3
    check_interval          5
    retry_interval          1
    notification_interval   60
    notification_period     24x7
    notification_options    d,u,r
}
