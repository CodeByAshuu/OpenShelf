# ==============================================================================
# OpenShelf Service Checks Definition: openshelf_services.cfg
# ==============================================================================

# ── 1. Website Availability (HTTP Port 80) ───────────────────────────────────
define service {
    use                     generic-service
    host_name               openshelf-server
    service_description     OpenShelf Website Availability
    check_command           check_http_port!80
    check_interval          3
    retry_interval          1
    notification_interval   30
}

# ── 2. Backend API Health Endpoint (Port 5000 /health) ───────────────────────
define service {
    use                     generic-service
    host_name               openshelf-server
    service_description     Backend API Health Endpoint
    check_command           check_http_health!5000!/health!ok
    check_interval          3
    retry_interval          1
    notification_interval   30
}

# ── 3. Nginx Service Status ──────────────────────────────────────────────────
define service {
    use                     generic-service
    host_name               openshelf-server
    service_description     Nginx Web Server Port
    check_command           check_tcp_port!80
    check_interval          3
    retry_interval          1
    notification_interval   30
}

# ── 4. Docker Service Status (Systemd daemon) ────────────────────────────────
define service {
    use                     generic-service
    host_name               openshelf-server
    service_description     Docker Daemon Service
    check_command           check_systemd_service!docker
    check_interval          5
    retry_interval          1
    notification_interval   30
}

# ── 5. Frontend Container Status (openshelf-frontend) ────────────────────────
define service {
    use                     generic-service
    host_name               openshelf-server
    service_description     Frontend Container (openshelf-frontend)
    check_command           check_docker_container!openshelf-frontend
    check_interval          3
    retry_interval          1
    notification_interval   30
}

# ── 6. Backend Container Status (openshelf-backend) ──────────────────────────
define service {
    use                     generic-service
    host_name               openshelf-server
    service_description     Backend Container (openshelf-backend)
    check_command           check_docker_container!openshelf-backend
    check_interval          3
    retry_interval          1
    notification_interval   30
}

# ── 7. CPU Utilization (Load Average) ────────────────────────────────────────
define service {
    use                     generic-service
    host_name               openshelf-server
    service_description     CPU Load Average
    check_command           check_local_load!5.0,4.0,3.0!10.0,8.0,6.0
    check_interval          5
    retry_interval          1
    notification_interval   60
}

# ── 8. Memory Utilization (%) ────────────────────────────────────────────────
define service {
    use                     generic-service
    host_name               openshelf-server
    service_description     Memory Utilization
    check_command           check_system_memory!80!90
    check_interval          5
    retry_interval          1
    notification_interval   60
}

# ── 9. Disk Space Utilization (%) ────────────────────────────────────────────
define service {
    use                     generic-service
    host_name               openshelf-server
    service_description     Root Disk Space Utilization
    check_command           check_local_disk!20%!10%!/
    check_interval          10
    retry_interval          2
    notification_interval   60
}
