---
# ==============================================================================
# OpenShelf - Non-sensitive Application and Infrastructure Variables
# ==============================================================================

# Application paths and system user
app_name: openshelf
app_dir: /opt/openshelf
app_user: ubuntu
app_group: ubuntu

# Network Ports
server_port: 5000
client_port: 80

# Environment Mode
node_env: production

# Frontend API URL
# Points browser API requests to the public EC2 host
vite_api_url: "http://{{ ansible_host }}:{{ server_port }}"

# Deployment source:
#   "local" : Syncs code from local repository (default, includes all unpushed devops changes)
#   "git"   : Clones repository from GitHub
app_deploy_method: "local"

# Git Repository configuration (used if app_deploy_method == "git")
repo_url: "https://github.com/CodeByAshuu/OpenShelf.git"
repo_branch: "devops"

# ==============================================================================
# Nagios Monitoring Configuration & Resource Thresholds
# ==============================================================================
nagios_port: 8080
nagios_admin_user: "nagiosadmin"
nagios_notification_email: "admin@openshelf.local"

# System Resource Monitoring Thresholds
nagios_cpu_warn: "5.0,4.0,3.0"
nagios_cpu_crit: "10.0,8.0,6.0"

nagios_mem_warn: 80
nagios_mem_crit: 90

nagios_disk_warn: "20%"
nagios_disk_crit: "10%"

